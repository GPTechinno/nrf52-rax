[package]
name = "nrf52-rax"
version = "0.1.0"
edition = "2024"
description = "nRF52 SoC emulator (nRF52832, nRF52833, nRF52840): rax's Cortex-M4F core with the memory map and the peripheral models"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
readme = "README.md"
keywords = ["nrf52", "nordic", "emulator", "cortex-m"]
categories = ["emulators", "embedded", "simulation"]

[dependencies]
# rax with its Cortex-M additions not upstream yet, from the `feat/cortex-m4f` branch of the fork;
# a version replaces it once rax is on crates.io
rax = { git = "https://github.com/Georges760/rax", branch = "feat/cortex-m4f", default-features = false }
goblin = "0.10"

[dev-dependencies]
defmt-decoder = "1.2"
