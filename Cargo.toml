[package]
name = "nrf52-rax"
version = "0.1.0"
edition = "2024"
description = "nRF52 SoC emulator (nRF52832, nRF52833, nRF52840): rax's Cortex-M4F core with the memory map and the peripheral models"
license = "MIT OR Apache-2.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
readme = "README.md"
keywords = ["nrf52", "nordic", "emulator", "cortex-m"]
categories = ["emulators", "embedded", "simulation"]

[dependencies]
# rax with its Cortex-M4F and Cortex-M7 additions, from a checkout of the `feat/cortex-m7` branch of
# https://github.com/Georges760/rax; a version goes next to the path once rax is on crates.io
rax = { path = "../../upstream/rax", default-features = false }
goblin = "0.10"

[dev-dependencies]
defmt-decoder = "1.2"
